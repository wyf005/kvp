<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动感尼姑</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
  <header>
    <h1>动感尼姑</h1>
  </header>
  <nav>
    <ul>
      <li><a href="#ruanjian">软件</a></li>
      <li><a href="#qita">其他</a></li>
    </ul>
  </nav>
  <main>
    <section id="ruanjian">
      <h2 class="category-title">软件</h2>
      <div class="link-grid"></div>
    </section>
    <section id="qita">
      <h2 class="category-title">其他</h2>
      <div class="link-grid"></div>
  </main>
  <div id="edit-form" style="display: none;">
    <h2>添加/编辑链接</h2>
    <form id="link-form">
      <input type="password" id="edit-password" name="edit_password" placeholder="编辑密码" required>
      <select id="category" name="category" required>
        <option value="">选择类别</option>
        <option value="ruanjian">软件</option>
        <option value="qita">其他</option>
      </select>
      <input type="text" id="title" name="title" placeholder="标题" required>
      <input type="url" id="url" name="url" placeholder="URL" required>
      <input type="text" id="icon" name="icon" placeholder="图标类名" required>
      <button type="submit">保存</button>
    </form>
  </div>
  <button id="toggle-edit">编辑模式</button>
  <footer>
    <p>&copy; 2023 WebNav Hub. 保留所有权利。</p>
    <nav>
      <a href="#">隐私政策</a>
      <a href="#">使用条款</a>
      <a href="#">联系我们</a>
    </nav>
  </footer>
  <script src="script.js"></script>
</body>
</html>
